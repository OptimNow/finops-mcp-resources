# ── Multi-cloud ──────────────────────────────────────────

- name: nable-finops-mcp
  provider: Multi-cloud
  repo: https://github.com/chaandannn/finopsmcp
  homepage: https://getnable.com
  category: reporting
  description: "Local-first FinOps server: cost queries, anomaly detection and rightsizing across AWS, Azure, GCP plus AI (OpenAI, Anthropic, Bedrock) and SaaS spend."
  capabilities:
    - get-cost-summary
    - explain-cost-drivers
    - detect-anomalies
    - get-rightsizing-recommendations
    - track-llm-spend-by-model
    - get-commitment-recommendations
  auth:
    - "Cloud provider credentials (stored in OS keyring, never leave the machine)"
  maturity: ga
  security_notes: "Read-only cost APIs; credentials encrypted locally; no vendor backend, nothing leaves the user's machine."
  tags:
    - finops
    - multi-cloud
    - aws
    - azure
    - gcp
    - ai-costs

# ── Workflow & Collaboration ─────────────────────────────

- name: finops-tagging-mcp
  provider: Other
  repo: https://github.com/OptimNow/finops-tagging-mcp
  category: tagging
  description: "Tag compliance checking, drift detection, and remediation for FinOps governance."
  capabilities:
    - check-tag-compliance
    - find-untagged-resources
    - suggest-tags
    - generate-compliance-report
    - detect-tag-drift
    - get-cost-attribution-gap
  auth:
    - "AWS credentials or cloud provider credentials"
  maturity: beta
  security_notes: "Read-only by default; policy generation produces files but does not deploy."
  tags:
    - finops
    - tagging
    - governance
    - compliance

- name: jira-mcp
  provider: Other
  repo: https://github.com/atlassian/mcp-server-jira
  category: other
  description: "JIRA integration for FinOps ticketing — cost anomaly tracking, optimization workflows."
  capabilities:
    - create-issue
    - search-issues
    - update-issue
    - transition-issue
  auth:
    - "JIRA API token"
  maturity: ga
  security_notes: "Use dedicated service account with minimal project permissions; store tokens in secrets manager."
  tags:
    - finops
    - workflow
    - ticketing

- name: slack-mcp
  provider: Other
  repo: https://github.com/modelcontextprotocol/servers
  homepage: https://github.com/modelcontextprotocol/servers/tree/main/src/slack
  category: other
  description: "Slack integration for FinOps alerts — cost anomaly notifications, budget threshold alerts."
  capabilities:
    - send-message
    - read-channel
    - search-messages
    - list-channels
  auth:
    - "Slack Bot Token (xoxb-)"
  maturity: ga
  security_notes: "Use dedicated bot with minimal channel permissions; prefer bot tokens over user tokens."
  tags:
    - finops
    - workflow
    - alerting
    - collaboration
