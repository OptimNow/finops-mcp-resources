# servers/registry.yaml
# Canonical list of MCP servers relevant to Cloud FinOps.
# One list item per server. Keep entries alphabetically sorted by `name`.

# ── AWS ──────────────────────────────────────────────────

- name: aws-billing-cost-management-mcp
  provider: AWS
  repo: https://github.com/awslabs/mcp
  homepage: https://awslabs.github.io/mcp/servers/billing-cost-management-mcp-server/
  category: reporting
  description: "Comprehensive billing and cost management with optimization recommendations."
  capabilities:
    - get-cost-and-usage
    - get-cost-forecast
    - get-savings-plans
    - get-reservations
    - get-recommendations
  auth:
    - "AWS credentials (env/SSO)"
  maturity: ga
  security_notes: "Read-only; requires ce:Get*, ce:List*, ce:Describe* permissions."
  tags:
    - finops
    - aws
    - billing
    - cost-management

- name: aws-cloudwatch-mcp
  provider: AWS
  repo: https://github.com/awslabs/mcp
  homepage: https://awslabs.github.io/mcp/servers/aws-cloudwatch-mcp-server/
  category: reporting
  description: "Metrics, alarms, and logs analysis for cost-related monitoring."
  capabilities:
    - get-metrics
    - get-alarms
    - query-logs
    - describe-log-groups
  auth:
    - "AWS credentials (env/SSO)"
  maturity: ga
  security_notes: "Read-only; requires cloudwatch:Get*, logs:Get* permissions."
  tags:
    - finops
    - aws
    - monitoring

- name: aws-cost-explorer-mcp
  provider: AWS
  repo: https://github.com/awslabs/mcp
  homepage: https://awslabs.github.io/mcp/servers/cost-explorer-mcp-server/
  category: reporting
  description: "Detailed cost analysis and reporting from AWS Cost Explorer."
  capabilities:
    - get-cost-and-usage
    - get-cost-forecast
    - get-dimension-values
    - get-tags
  auth:
    - "AWS credentials (env/SSO)"
  maturity: ga
  security_notes: "Read-only; requires ce:Get* permissions."
  tags:
    - finops
    - aws
    - cost-analysis

- name: aws-finops-mcp-server
  provider: AWS
  repo: https://github.com/ravikiranvm/aws-finops-mcp-server
  category: reporting
  description: "Community MCP server focused on AWS financial operations and cost management."
  capabilities:
    - cost-anomaly-detection
    - budget-monitoring
    - resource-utilization
    - cost-allocation
  auth:
    - "AWS credentials (env/SSO)"
  maturity: beta
  security_notes: "Community project; review permissions before use."
  tags:
    - finops
    - aws
    - community

- name: aws-mcp-server
  provider: AWS
  repo: https://github.com/aws/mcp-proxy-for-aws
  homepage: https://docs.aws.amazon.com/agent-toolkit/latest/userguide/mcp-server.html
  category: other
  description: "AWS-hosted MCP server (GA May 6, 2026); 15,000+ AWS APIs via call_aws, server-side Python sandbox via run_script, and on-demand Skills maintained by AWS service teams."
  capabilities:
    - call-aws-api
    - run-script
    - search-documentation
    - read-documentation
    - skills
    - recommend
  auth:
    - "AWS IAM (SSO/credentials)"
  maturity: ga
  security_notes: "Remote server; IAM-scoped; audit logging available."
  demo: tutorials/07-aws-mcp-remote-server.md
  tags:
    - finops
    - aws
    - remote

- name: aws-pricing-mcp
  provider: AWS
  repo: https://github.com/awslabs/mcp
  homepage: https://awslabs.github.io/mcp/
  category: pricing
  description: "Query AWS pricing data and simulate costs for scenarios."
  capabilities:
    - list-offerings
    - price-lookup
    - simulate-cost
  auth:
    - "AWS credentials (env/SSO)"
  maturity: ga
  security_notes: "Read-only; no resource mutations; validate data sources before decisions."
  demo: tutorials/01-aws-pricing-quickstart.md
  tags:
    - finops
    - aws
    - pricing

- name: cfm-tips-mcp
  provider: AWS
  repo: https://github.com/aws-samples/sample-cfm-tips-mcp
  category: governance
  description: "Cost optimization playbooks and actionable savings recommendations."
  capabilities:
    - get-optimization-tips
    - describe-resources
    - get-savings-recommendations
  auth:
    - "AWS credentials (env/SSO)"
  maturity: beta
  security_notes: "Read-only; requires Describe* access for EC2, RDS, Lambda, and optimization APIs."
  tags:
    - finops
    - aws
    - optimization

# ── Azure ────────────────────────────────────────────────

- name: azure-finops-mcp-server
  provider: Azure
  repo: https://github.com/julianobarbosa/azure-finops-mcp-server
  category: reporting
  description: "Community Azure FinOps server with cost analysis and unused resource detection."
  capabilities:
    - get-cost
    - run-finops-audit
  auth:
    - "Azure CLI credentials"
  maturity: ga
  security_notes: "Read-only; 97.7% test coverage; credentials stay local via Azure CLI."
  tags:
    - finops
    - azure
    - cost-analysis
    - community

- name: azure-mcp
  provider: Azure
  repo: https://github.com/Azure/azure-mcp
  category: other
  description: "Official Microsoft Azure MCP server for resource management and monitoring (no cost/billing APIs)."
  capabilities:
    - manage-resources
    - query-resource-graph
    - monitor-metrics
    - manage-storage
  auth:
    - "Azure credentials (CLI/service principal)"
  maturity: ga
  security_notes: "Official Microsoft server; Reader role required; does NOT expose cost management APIs."
  tags:
    - azure
    - resource-management

- name: finopshub-mcp
  provider: Azure
  repo: https://github.com/mc5eamus/finopshub-mcp
  category: reporting
  description: "Proof-of-concept Azure FinOps Hub MCP integration."
  capabilities:
    - query-finops-hub
  auth:
    - "Azure credentials"
  maturity: alpha
  security_notes: "Proof-of-concept; no test coverage or CI/CD; not production-ready."
  tags:
    - finops
    - azure
    - community

