# servers/registry.yaml
# Canonical list of MCP servers relevant to Cloud FinOps.
# One list item per server. Keep entries alphabetically sorted by `name`.

# ── AWS ──────────────────────────────────────────────────

- name: aws-billing-cost-management-mcp
  provider: AWS
  repo: https://github.com/awslabs/mcp
  homepage: https://awslabs.github.io/mcp/servers/billing-cost-management-mcp-server/
  category: reporting
  description: "Comprehensive billing and cost management with optimization recommendations."
  capabilities:
    - get-cost-and-usage
    - get-cost-forecast
    - get-savings-plans
    - get-reservations
    - get-recommendations
  auth:
    - "AWS credentials (env/SSO)"
  maturity: ga
  security_notes: "Read-only; requires ce:Get*, ce:List*, ce:Describe* permissions."
  tags:
    - finops
    - aws
    - billing
    - cost-management

